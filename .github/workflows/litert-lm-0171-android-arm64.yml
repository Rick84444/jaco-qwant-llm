name: experimental-litert-lm-0171-android-arm64
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/litert-lm-0171-android-arm64.yml
      - native/patch_litert_acfq_v0171.py
      - native/litert_acfq_shadow.h
      - native/gemma_int4_kernel.c
      - native/gemma_int4_kernel.h
      - native/prepare_litert_bazel_v0171.py

permissions:
  contents: read

concurrency:
  group: experimental-litert-lm-0171-android-arm64
  cancel-in-progress: true

jobs:
  build-from-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Bazel and source dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q git-lfs ccache patchelf pkg-config libssl-dev
          git lfs install
          # Global /usr/local npm prefix is read-only for the runner user.
          npm install --prefix "$RUNNER_TEMP/jaco-bazel" --no-save @bazel/bazelisk
          export PATH="$RUNNER_TEMP/jaco-bazel/node_modules/.bin:$PATH"
          echo "$RUNNER_TEMP/jaco-bazel/node_modules/.bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          bazelisk version
      - name: Use runner's preinstalled Android SDK (avoid obsolete tools package)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --install \
            "platforms;android-34" "build-tools;34.0.0"
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28b
          add-to-path: false
      - name: Export Android NDK for upstream Bazel rules
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -d "${{ steps.ndk.outputs.ndk-path }}"
      - name: Fetch exact LiteRT-LM and LiteRT pins
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 --no-checkout \
            https://github.com/google-ai-edge/LiteRT-LM.git \
            "$RUNNER_TEMP/jaco-litert-lm-0171"
          git -C "$RUNNER_TEMP/jaco-litert-lm-0171" fetch --depth=1 origin \
            5e58e9a0aef7abf7091207a8b1d1063a1c800f08
          git -C "$RUNNER_TEMP/jaco-litert-lm-0171" checkout --detach \
            5e58e9a0aef7abf7091207a8b1d1063a1c800f08
          test "$(cat "$RUNNER_TEMP/jaco-litert-lm-0171/.bazelversion")" = "7.6.1"
          git clone --filter=blob:none --depth=1 --no-checkout \
            https://github.com/google-ai-edge/LiteRT.git \
            "$HOME/jaco-litert-acfq-0171-source"
          git -C "$HOME/jaco-litert-acfq-0171-source" fetch --depth=1 origin \
            9fe5be45564c868408e6514c8aabb83e211a0911
          git -C "$HOME/jaco-litert-acfq-0171-source" checkout --detach \
            9fe5be45564c868408e6514c8aabb83e211a0911
      - name: Apply ACFQ only to isolated LiteRT source
        run: |
          set -euo pipefail
          python3 native/patch_litert_acfq_v0171.py \
            --litert-root "$HOME/jaco-litert-acfq-0171-source" --check
          python3 native/patch_litert_acfq_v0171.py \
            --litert-root "$HOME/jaco-litert-acfq-0171-source" --apply
          grep -q JACO_ACFQ_SHADOW_SOURCE_PATCH_V1 \
            "$HOME/jaco-litert-acfq-0171-source/litert/runtime/compiled_model.cc"
      - name: Declare ACFQ sources in the pinned Bazel compiled_model rule
        run: |
          set -euo pipefail
          python3 native/prepare_litert_bazel_v0171.py \
            --litert-root "$HOME/jaco-litert-acfq-0171-source" --check
          python3 native/prepare_litert_bazel_v0171.py \
            --litert-root "$HOME/jaco-litert-acfq-0171-source" --apply
          grep -q '"jaco_acfq_native/gemma_int4_kernel.c"' \
            "$HOME/jaco-litert-acfq-0171-source/litert/runtime/BUILD"
      - name: Build full LiteRT-LM v0.17.1 Android ARM64 native shared library
        timeout-minutes: 75
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/jaco-litert-lm-0171"
          # Build from source, NOT Python wheel using a prebuilt engine.
          # Bazel external @litert must point to our pinned ACFQ-patched tree.
          bazelisk build --config=android_arm64 -c opt \
            --jobs=2 --local_ram_resources=4096 \
            --override_repository=litert="$HOME/jaco-litert-acfq-0171-source" \
            //c:litert-lm \
            2>&1 | tee "$GITHUB_WORKSPACE/litert-lm-arm64-build.log"
      - name: Inspect experimental Android library
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/experimental-artifact"
          cp -L "$RUNNER_TEMP/jaco-litert-lm-0171/bazel-bin/c/liblitert-lm.so" \
            "$GITHUB_WORKSPACE/experimental-artifact/liblitert-lm-acfq-0171-experimental.so"
          SO="$GITHUB_WORKSPACE/experimental-artifact/liblitert-lm-acfq-0171-experimental.so"
          readelf -h "$SO" | tee "$GITHUB_WORKSPACE/experimental-artifact/elf-header.txt"
          readelf -d "$SO" | tee "$GITHUB_WORKSPACE/experimental-artifact/elf-dependencies.txt"
          grep -q 'Machine:.*AArch64' "$GITHUB_WORKSPACE/experimental-artifact/elf-header.txt"
          grep -q 'Type:.*DYN' "$GITHUB_WORKSPACE/experimental-artifact/elf-header.txt"
          grep -q '\[libc.so\]' "$GITHUB_WORKSPACE/experimental-artifact/elf-dependencies.txt"
          grep -q '\[libandroid.so\]' "$GITHUB_WORKSPACE/experimental-artifact/elf-dependencies.txt"
          grep -aFq 'JACO_ACFQ_SHADOW: registration_installed=1' "$SO"
          sha256sum "$SO" > "$GITHUB_WORKSPACE/experimental-artifact/SHA256SUMS"
          echo 'EXPERIMENTAL ONLY: no Android run, Gemma parity or speed verified' \
            > "$GITHUB_WORKSPACE/experimental-artifact/NOT_READY_FOR_DEPLOYMENT.txt"
      - name: Upload experimental binary only if all checks pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-litert-lm-0171-android-arm64
          path: experimental-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-litert-lm-arm64-build-log
          path: litert-lm-arm64-build.log
          if-no-files-found: ignore
          retention-days: 7
