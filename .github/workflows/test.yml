name: runtime-and-kernel-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Runtime contract tests
        run: node --test runtime/*.test.mjs
      - name: Gemma A/B comparison contract tests
        run: node --test bench/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          pip install numpy ziglang
      - name: LiteRT engine compatibility probe tests
        run: python -m unittest discover -s runtime -p 'test_engine_patch.py'
      - name: LiteRT architecture-review tests
        run: python -m unittest discover -s research -p 'test_*.py'
      - name: Native ACFQ operator ABI tests
        run: python -m unittest discover -s native -p 'test_*.py'
      - name: Scalar Gemma INT8xINT4 C smoke test
        run: |
          cc -std=c11 -O2 -Wall -Wextra -I native native/gemma_int4_kernel.c native/test_gemma_int4_kernel.c -lm -o /tmp/gemma-int4-test
          /tmp/gemma-int4-test
      - name: AArch64 NEON Gemma INT8xINT4 smoke test
        run: |
          python -m ziglang cc -target aarch64-linux-musl -O2 -static -I native native/gemma_int4_kernel.c native/test_gemma_int4_kernel.c -lm -o /tmp/gemma-int4-arm64
          qemu-aarch64-static /tmp/gemma-int4-arm64
      - name: INT8xINT4 benchmark smoke test (synthetic)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -D_POSIX_C_SOURCE=200809L -I native native/gemma_int4_kernel.c native/bench_gemma_int4.c -lm -o /tmp/jaco-int4-bench
          /tmp/jaco-int4-bench --quick --reps 2
      - name: ACFQ LiteRT shadow C++ bridge smoke (mock ABI)
        run: |
          cc -std=c11 -O2 -I native -c native/gemma_int4_kernel.c -o /tmp/gemma-int4.o
          c++ -std=c++17 -O2 -Wall -Wextra -I native/shadow_stubs -I native native/test_litert_acfq_shadow.cc /tmp/gemma-int4.o -lm -o /tmp/jaco-litert-shadow-check
          /tmp/jaco-litert-shadow-check 2>&1 | tee /tmp/jaco-litert-shadow-test.log
          grep -q "JACO_ACFQ_SHADOW: native_invocations=1" /tmp/jaco-litert-shadow-test.log
          grep -q "JACO shadow smoke PASS" /tmp/jaco-litert-shadow-test.log
      - name: Authentic pinned LiteRT C ABI smoke (not linked runtime)
        env:
          JACO_LITERT_ABI_SOURCE_MODE: download
        run: bash native/verify_litert_abi.sh
      - name: Android isolated source setup syntax validation
        run: |
          bash -n native/setup_litert_acfq_source.sh
          grep -q '44455548be35bde21737b8a28ef0d027632c282d' native/setup_litert_acfq_source.sh
      - name: Isolated LiteRT source patch integration smoke (pinned upstream)
        run: |
          set -e
          root=/tmp/jaco-litert-isolated
          mkdir -p "$root/litert/runtime" "$root/tflite/core/c"
          curl --fail --silent --show-error --location --retry 2 \
            https://raw.githubusercontent.com/google-ai-edge/LiteRT/44455548be35bde21737b8a28ef0d027632c282d/litert/runtime/compiled_model.cc \
            -o "$root/litert/runtime/compiled_model.cc"
          touch "$root/tflite/core/c/common.h"
          python3 native/patch_litert_acfq.py --litert-root "$root" --check
          python3 native/patch_litert_acfq.py --litert-root "$root" --apply
          grep -q JACO_ACFQ_SHADOW_SOURCE_PATCH_V1 "$root/litert/runtime/compiled_model.cc"
          grep -q 'jaco_acfq::ShadowRegistration' "$root/litert/runtime/compiled_model.cc"
          test -f "$root/litert/runtime/compiled_model.cc.jaco-original"
          test -f "$root/litert/runtime/jaco_acfq_native/gemma_int4_kernel.c"
      - name: C++ native probe compilation
        run: CXX=g++ sh bench/build.sh
      - name: Scalar path (x86-64)
        run: |
          gcc -O2 -Wall -Wextra test_acfq.c -o test_acfq -lm
          ./test_acfq
      - name: NEON path (aarch64, qemu)
        run: |
          python -m ziglang cc -target aarch64-linux-musl -O2 -static test_acfq.c -o t_neon -lm
          qemu-aarch64-static ./t_neon
      - name: NEON + fp16 path (aarch64, qemu)
        run: |
          python -m ziglang cc -target aarch64-linux-musl -mcpu=cortex_a76 -O2 -static test_acfq.c -o t_fp16 -lm
          qemu-aarch64-static ./t_fp16 | tee fp16.log
          grep -q "fp16 arithmetic on" fp16.log
      - name: Rig smoke run
        run: |
          gcc -O3 -shared -fPIC acfq_kernel.c -o libacfq.so -lm
          gcc -O3 -shared -fPIC acf_kernel.c -o libacf_rig.so -lm
          python acfq_rig.py --synthetic --K 256 --N 256 --tokens 64 --rounds 2 --reps 1
          python acf_rig.py --synthetic --K 256 --N 256 --tokens 64 --reps 1
