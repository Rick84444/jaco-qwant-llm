name: final-litert-cpu-source-build
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/litert-real-build.yml
jobs:
  isolated-linux-cpu-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Host resources and dependencies
        run: |
          set -e
          df -h /
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build cmake libabsl-dev libeigen3-dev \
            libvulkan-dev opencl-headers libegl1-mesa-dev libgles-dev \
            libgl-dev libflatbuffers-dev pkg-config
      - name: Fetch exact upstream LiteRT revision, never a moving branch
        run: |
          set -e
          git clone --quiet --filter=blob:none --depth=1 --no-checkout \
            https://github.com/google-ai-edge/LiteRT.git /tmp/jaco-litert-real
          git -C /tmp/jaco-litert-real fetch --quiet --depth=1 \
            origin 44455548be35bde21737b8a28ef0d027632c282d
          git -C /tmp/jaco-litert-real checkout --quiet --detach \
            44455548be35bde21737b8a28ef0d027632c282d
          test -s /tmp/jaco-litert-real/tflite/CMakeLists.txt
      - name: Apply shadow hook only to isolated upstream checkout
        run: |
          set -e
          python3 native/patch_litert_acfq.py --litert-root /tmp/jaco-litert-real --check
          python3 native/patch_litert_acfq.py --litert-root /tmp/jaco-litert-real --apply
          grep -q JACO_ACFQ_SHADOW_SOURCE_PATCH_V1 \
            /tmp/jaco-litert-real/litert/runtime/compiled_model.cc
      - name: Configure actual LiteRT CPU runtime (GPU and NPU off)
        timeout-minutes: 22
        run: |
          set -o pipefail
          cmake -S /tmp/jaco-litert-real/litert -B /tmp/jaco-litert-real-build \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLITERT_ENABLE_GPU=OFF -DLITERT_ENABLE_NPU=OFF \
            -DLITERT_DISABLE_KLEIDIAI=ON \
            -DLITERT_BUILD_TESTS=OFF \
            -DTFLITE_ENABLE_XNNPACK=OFF \
            2>&1 | tee "$GITHUB_WORKSPACE/litert-configure.log"
      - name: Build patched official LiteRT runtime target
        timeout-minutes: 22
        run: |
          set -o pipefail
          cmake --build /tmp/jaco-litert-real-build --target litert_runtime --parallel 2 \
            2>&1 | tee "$GITHUB_WORKSPACE/litert-build.log"
          find /tmp/jaco-litert-real-build -name 'liblitert_runtime*' -print
      - name: Upload configuration/build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litert-acfq-real-build-logs
          path: |
            litert-configure.log
            litert-build.log
          if-no-files-found: ignore
          retention-days: 7
