name: Publish JACO Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      space_id:
        description: "Hugging Face Space ID (owner/space-name)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-static-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official Hub client
        run: python -m pip install 'huggingface_hub>=0.33,<2'
      - name: Upload static demo to Hugging Face
        env:
          HF_SPACE_WRITE_TOKEN: ${{ secrets.HF_SPACE_WRITE_TOKEN }}
          HF_SPACE_ID: ${{ inputs.space_id }}
        run: |
          python - <<'PY'
          import os
          import re
          from huggingface_hub import HfApi

          token = os.environ.get("HF_SPACE_WRITE_TOKEN", "")
          repo_id = os.environ.get("HF_SPACE_ID", "").strip()
          if not token:
              raise SystemExit("Missing GitHub Actions secret HF_SPACE_WRITE_TOKEN")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo_id):
              raise SystemExit("space_id must be owner/space-name")
          api = HfApi(token=token)
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="static",
                          private=False, exist_ok=True)
          api.upload_folder(repo_id=repo_id, repo_type="space",
                            folder_path="demo/huggingface-space",
                            commit_message="Publish JACO public model explorer")
          print("Published https://huggingface.co/spaces/" + repo_id)
          PY
